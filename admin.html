<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | LM Multimarcas</title><style>body{font:16px Arial;background:#fff7fa;color:#422536;margin:0}main{max-width:740px;margin:40px auto;padding:24px;background:white;border:1px solid #efd3df;border-radius:18px}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #dbb9c8}input,select{width:100%;box-sizing:border-box}label{display:block;margin:14px 0}button{background:#b83c70;color:white;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;justify-content:space-between;align-items:center;gap:12px}article{padding:12px 0;border-bottom:1px solid #eee}article button{margin-left:6px}#msg{color:#8c2d56;white-space:pre-wrap}small{color:#75616b}</style></head><body><main><nav><h1>LM Multimarcas · Administração</h1><a href="index.html">Ver loja</a></nav><p id="msg"></p><section id="login"><h2>Entrar</h2><form id="loginForm"><label>E-mail<input type="email" id="email" required autocomplete="username"></label><label>Senha<input type="password" id="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="panel" hidden><button id="logout">Sair</button><h2>Produtos</h2><div id="items"></div><h2>Adicionar ou editar</h2><form id="productForm"><input type="hidden" id="id"><label>Nome<input id="name" required></label><label>Categoria<select id="category"><option>Camisetas</option><option>Tênis</option><option>Calças</option><option>Jaquetas</option></select></label><label>Preço (R$)<input id="price" type="number" min="0" step="0.01" required></label><label>Link HTTPS da foto<input id="img" type="url" placeholder="https://..."></label><button>Salvar produto</button> <button type="reset">Limpar</button></form><p><small>As permissões são verificadas no banco de dados. Somente o usuário autorizado pode alterar produtos.</small></p></section></main><script src="config.js"></script><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const cfg=window.LM_CONFIG,msg=document.querySelector('#msg'),login=document.querySelector('#login'),panel=document.querySelector('#panel');
if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey){msg.textContent='Configure config.js e execute o SQL antes de utilizar este painel.';document.querySelector('#loginForm button').disabled=true;throw Error('Supabase não configurado')}
const db=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
const say=x=>msg.textContent=x||'';
async function check(){const {data:{user}}=await db.auth.getUser();if(!user){login.hidden=false;panel.hidden=true;return}const {data,error}=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await db.auth.signOut();say('Esta conta não tem autorização para administrar a loja.');login.hidden=false;panel.hidden=true;return}login.hidden=true;panel.hidden=false;await load()}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();say('Entrando...');const {error}=await db.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});if(error){say('Não foi possível entrar. Confira seus dados.');return}say('');await check()};
document.querySelector('#logout').onclick=async()=>{await db.auth.signOut();await check()};
let catalog=[];
async function load(){const {data,error}=await db.from('products').select('*').order('id');if(error){say('Erro ao carregar produtos: '+error.message);return}catalog=data||[];const items=document.querySelector('#items');items.replaceChildren();for(const p of catalog){const a=document.createElement('article'),t=document.createElement('strong'),edit=document.createElement('button'),del=document.createElement('button');t.textContent=p.name+' — R$ '+Number(p.price).toFixed(2).replace('.',',');edit.textContent='Editar';del.textContent='Excluir';edit.onclick=()=>{for(const k of ['id','name','category','price','img'])document.getElementById(k).value=p[k]??'';document.querySelector('#productForm').scrollIntoView({behavior:'smooth'})};del.onclick=async()=>{if(!confirm('Excluir '+p.name+'?'))return;const {error}=await db.from('products').delete().eq('id',p.id);if(error)say(error.message);else await load()};a.append(t,edit,del);items.append(a)}}
document.querySelector('#productForm').onsubmit=async e=>{e.preventDefault();const id=document.querySelector('#id').value;const img=document.querySelector('#img').value.trim();if(img&&!img.startsWith('https://')){say('A imagem deve usar HTTPS.');return}const p={name:document.querySelector('#name').value.trim(),category:document.querySelector('#category').value,price:Number(document.querySelector('#price').value),img:img||'https://placehold.co/600x750/fce8ef/7a3855?text=LM+Multimarcas'};const result=id?await db.from('products').update(p).eq('id',Number(id)):await db.from('products').insert(p);if(result.error){say('Erro: '+result.error.message);return}say('Produto salvo!');e.target.reset();document.querySelector('#id').value='';await load()};
await check();
</script></body></html>
